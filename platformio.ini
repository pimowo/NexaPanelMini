[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI
    paulstoffregen/XPT2046_Touchscreen

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=D7
    -D TFT_MISO=D6
    -D TFT_SCLK=D5
    -D TFT_CS=D8
    -D TFT_DC=D1
    -D TFT_RST=-1
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D SMOOTH_FONT=1
    -D BOTTOMBAR_RENDER_DIAGNOSTICS=1

; Uwaga:
; piny dotyku i podświetlenia są zdefiniowane w include/pins.h.
